<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#161b27">
<title>孤勇者 v17.82</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="孤勇者">
<link rel="preload" href="fonts/jf-openhuninn-2.0-sub.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/Cubic_11.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css?v=17.82">
</head>
<body>
<div id="app">
  <!-- v17.70 主畫面新版（design-wip design/ui/草圖_主畫面.png）：圖示由 ui.js 的 IC() 填進 [data-ic] -->
  <div class="rbar wbar" id="rbar"><span id="date"></span><span class="rsp"></span><span class="mpill"><span class="num s" id="pGold"><i data-ic="金幣"></i><b id="gold">0</b></span><span class="num s" id="pFame"><i data-ic="名聲"></i><b id="fame"></b></span></span><button class="pb mbtn" id="bPause" aria-label="暫停"></button><button class="pb mbtn" id="bSpeed" aria-label="快轉"></button></div>
  <div class="stage" id="mapw">
    <canvas id="cv" width="720" height="540" aria-label="勇者所在的地圖"></canvas>
    <div class="hud">
      <button class="cap pb" id="cap" aria-label="打開勇者檔案">
        <canvas id="face" width="48" height="48" aria-label="勇者的表情"></canvas>
        <span class="capr"><span class="hn"><b id="hname"></b><span id="hsub"></span></span><span class="bars" id="bars"></span></span>
      </button>
    </div>
    <div class="arow" id="arow"></div>
    <button class="bell pb" id="bell" aria-label="提醒"><i data-ic="鈴鐺" data-sc="2"></i><i id="bellN"></i></button>
    <div class="alerts" id="alerts"></div>
    <div class="mtabs" id="mtabs"></div>
    <div class="ztag" id="ztag"></div>
    <div class="act"><span class="pb" id="actw"><i id="actI"></i><span id="act"></span></span></div>
  </div>
  <div class="chat" id="chat">
    <button class="chH" id="chH" aria-label="展開對話"><i></i></button>
    <div class="chh"><span class="ff" id="ff"></span><button class="pb tbtn" id="tOpen"><i data-ic="互動" data-sc="2"></i>互動</button><button class="chx" id="chX" hidden></button><span id="chT" hidden></span></div>
    <div id="feed" aria-live="polite"></div>
    <div id="replies"></div>
  </div>
  <nav id="nav">
    <button data-t="gear"><i class="bdg" id="bd_gear"></i><i data-ic="金幣" data-sc="2"></i>花錢</button>
    <button data-t="people"><i class="bdg" id="bd_people"></i><i data-ic="人際" data-sc="2"></i>人際</button>
    <button data-t="quest"><i class="bdg" id="bd_quest"></i><i data-ic="排程" data-sc="2"></i>任務<i class="dot" id="dQuest"></i></button>
    <button data-t="office"><i class="bdg" id="bd_office"></i><i data-ic="事務所" data-sc="2"></i>事務所<i class="dot" id="dOffice"></i></button>
    <button data-t="set"><i class="bdg" id="bd_set"></i><i data-ic="設定" data-sc="2"></i>設定</button>
  </nav>

  <div class="sheet" id="sheet"><div class="sh"><b class="px" id="shT"></b><button class="pb shh" id="shHelp" aria-label="說明" hidden></button><button class="ib" id="shX" aria-label="關閉">✕</button></div><div class="subs" id="shS" role="tablist"></div><div class="sb" id="shB"></div></div>
  <div class="ov" id="mission"><div class="box" id="mBox"></div></div>
  <div class="ov" id="dying"></div>
  <div class="ov" id="end"></div>
  <div class="ov" id="evp"></div>
  <div class="toast" id="toast"></div>
  <div class="tipbox" id="tipbox"></div>
  <div class="tipbox popbox" id="popbox"></div>
</div>

<script src="js/data.js?v=17.82"></script>
<script src="js/sim.js?v=17.82"></script>
<script src="js/art.js?v=17.82"></script>
<script src="js/map.js?v=17.82"></script>
<script src="js/ui.js?v=17.82"></script>
<script src="js/main.js?v=17.82"></script>
<script>
// v17.28：App 模式（加到主畫面）用的 service worker。有網路一律拿最新版，沒網路才用上次存下來的
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
