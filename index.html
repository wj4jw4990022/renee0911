<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#161b27">
<title>孤勇者 v17.42</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="孤勇者">
<link rel="preload" href="fonts/Cubic_11.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css?v=17.42">
</head>
<body>
<div id="app">
  <div class="rbar" id="rbar"><span id="date"></span><span class="rsp"></span><span class="coin money"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="#f2c14e" stroke-width="1.6"/><path d="M8 4.5v7M6 6h3a1.2 1.2 0 010 2.4H7a1.2 1.2 0 000 2.4h3" fill="none" stroke="#f2c14e" stroke-width="1.3"/></svg><b id="gold">0</b><span class="sep"></span><span class="fame"><svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5l1.9 4.1 4.4.5-3.3 3 .9 4.4L8 11.3l-3.9 2.2.9-4.4-3.3-3 4.4-.5z" fill="#59a8ff"/></svg><b id="fame"></b></span></span><button class="ib sm" id="bPause" aria-label="暫停">⏸</button><button class="ib sm" id="bSpeed">x1</button></div>
  <div class="stage" id="mapw">
    <canvas id="cv" width="720" height="540" aria-label="勇者所在的地圖"></canvas>
    <div class="hud">
      <button class="cap" id="cap" aria-label="打開勇者檔案">
        <span class="av"><canvas id="face" width="20" height="20" style="width:30px;height:30px;image-rendering:pixelated" aria-label="勇者的表情"></canvas></span>
        <span class="capr"><span class="hn"><b class="px" id="hname"></b><span id="hsub"></span></span><span class="bars" id="bars"></span></span>
      </button>
    </div>
    <div class="arow" id="arow"></div>
    <button class="bell" id="bell" aria-label="提醒"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 16V11a6 6 0 0112 0v5l2 2H4z"/><path d="M10 20a2 2 0 004 0"/></svg><i id="bellN"></i></button>
    <div class="alerts" id="alerts"></div>
    <div class="mtabs" id="mtabs"></div>
    <div class="ztag" id="ztag"></div>
    <div class="act"><span id="act"></span></div>
  </div>
  <div class="chat" id="chat">
    <button class="chH" id="chH" aria-label="展開對話"><i></i></button>
    <div class="chh"><span class="k" id="chT">最新動態</span><span class="ff" id="ff"></span><button class="chx" id="chX">展開 ›</button></div>
    <div id="feed" aria-live="polite"></div>
    <div id="replies"></div>
  </div>
  <nav id="nav">
    <button data-t="gear"><i class="bdg" id="bd_gear"></i><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke-width="1.5" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><path d="M10 6v8M7.8 7.8h3.4a1.4 1.4 0 010 2.8H8.8a1.4 1.4 0 000 2.8h3.4"/></svg>花錢</button>
    <button data-t="people"><i class="bdg" id="bd_people"></i><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke-width="1.5" aria-hidden="true"><circle cx="7.5" cy="7" r="2.8"/><circle cx="13.5" cy="7.5" r="2.3"/><path d="M2.5 16c.6-3 2.6-4.5 5-4.5s4.4 1.5 5 4.5M12.5 11.6c2.2 0 3.9 1.3 4.5 3.9"/></svg>人際</button>
    <button data-t="quest" class="mid"><i class="bdg" id="bd_quest"></i><span class="midb"><svg class="qring" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="29" fill="none" stroke="rgba(18,22,31,.25)" stroke-width="4"/><circle id="qRing" cx="32" cy="32" r="29" fill="none" stroke="#12161f" stroke-width="4" stroke-linecap="round" stroke-dasharray="182.2" stroke-dashoffset="182.2" transform="rotate(-90 32 32)"/></svg><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke-width="1.5" aria-hidden="true"><path d="M5 3h10v14H5z M8 7h4 M8 10h4 M8 13h2"/></svg></span>任務<i class="dot" id="dQuest"></i></button>
    <button data-t="office"><i class="bdg" id="bd_office"></i><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke-width="1.5" aria-hidden="true"><path d="M3 17h14 M5 17V7l5-3 5 3v10 M8 17v-4h4v4 M8 9h1 M11 9h1"/></svg>事務所<i class="dot" id="dOffice"></i></button>
    <button data-t="set"><i class="bdg" id="bd_set"></i><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke-width="1.5" aria-hidden="true"><circle cx="10" cy="10" r="2.5"/><path d="M10 2.5v2.5M10 15v2.5M2.5 10H5M15 10h2.5M4.7 4.7l1.8 1.8M13.5 13.5l1.8 1.8M4.7 15.3l1.8-1.8M13.5 6.5l1.8-1.8"/></svg>設定</button>
  </nav>

  <div class="sheet" id="sheet"><div class="sh"><b class="px" id="shT"></b><button class="ib" id="shX" aria-label="關閉">✕</button></div><div class="subs" id="shS" role="tablist"></div><div class="sb" id="shB"></div></div>
  <div class="ov" id="mission"><div class="box" id="mBox"></div></div>
  <div class="ov" id="dying"></div>
  <div class="ov" id="end"></div>
  <div class="ov" id="evp"></div>
  <div class="toast" id="toast"></div>
</div>

<script src="js/data.js?v=17.42"></script>
<script src="js/sim.js?v=17.42"></script>
<script src="js/art.js?v=17.42"></script>

<script src="js/ui.js?v=17.42"></script>

<script>
// v17.28：App 模式（加到主畫面）用的 service worker。有網路一律拿最新版，沒網路才用上次存下來的
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
